<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/assets/images/mark.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0A0A0A;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
        .login-logo { margin-bottom: 36px; }
        .login-logo img { width: 72px; height: auto; margin-bottom: 18px; }
        .login-logo h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 0.9;
        }
        .login-logo p {
            margin-top: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #ED1C24;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.28);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }
        .input-wrapper input:focus { border-color: #ED1C24; }
        .input-wrapper input::placeholder { color: rgba(255,255,255,0.35); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #ED1C24;
            color: #fff;
            border: 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover { background: #C41218; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            display: none;
            border: 1px solid rgba(237,28,36,0.5);
            color: #fff;
            padding: 12px 14px;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .error-msg.visible { display: block; }
        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: rgba(255,255,255,0.55);
            font-family: 'Barlow Condensed', sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/images/mark-on-dark.svg" alt="">
            <h1>İbrahim Ersoran</h1>
            <p>Personal Trainer</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Şifre</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Admin şifrenizi girin" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn-login" id="btn-login">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </button>
        </form>

        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Siteye Dön</a>
    </div>

    <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const btn = document.getElementById('btn-login');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        if (!password) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kontrol ediliyor...';
        errorEl.classList.remove('visible');

        try {
            const res = await fetch(apiUrl('/api/auth/login'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                if (data.token) sessionStorage.setItem('admin_token', data.token);
                window.location.href = '/admin/';
                return;
            }

            let msg = data.error || 'Giris basarisiz';
            if (data.attemptsLeft !== undefined && data.attemptsLeft > 0) {
                msg += ` (${data.attemptsLeft} deneme hakkı kaldı)`;
            }
            if (data.remainingSeconds) {
                const min = Math.ceil(data.remainingSeconds / 60);
                msg += ` (${min} dakika beklemeniz gerekiyor)`;
            }

            errorEl.textContent = msg;
            errorEl.classList.add('visible');
        } catch (err) {
            errorEl.textContent = 'Baglanti hatasi. Lutfen tekrar deneyin.';
            errorEl.classList.add('visible');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
    });

    const API_ORIGIN = /onrender\.com$/.test(location.hostname) || location.hostname === 'localhost'
        ? ''
        : 'https://sport-xmgh.onrender.com';

    function apiUrl(path) {
        return API_ORIGIN + path;
    }

    (async () => {
        try {
            const token = sessionStorage.getItem('admin_token');
            const res = await fetch(apiUrl('/api/auth/check'), {
                headers: token ? { Authorization: 'Bearer ' + token } : {},
                credentials: 'include'
            });
            const data = await res.json();
            if (data.authenticated) window.location.href = '/admin/';
            else sessionStorage.removeItem('admin_token');
        } catch {}
    })();
    </script>
</body>
</html>
