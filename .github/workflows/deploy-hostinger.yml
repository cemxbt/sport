name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/**'

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p deploy
          cp -r public/* deploy/
          cp public/.htaccess deploy/ 2>/dev/null || true
          cp public/.nojekyll deploy/ 2>/dev/null || true
          mkdir -p deploy/data
          cp data/*.json deploy/data/ 2>/dev/null || true
          rm -f deploy/data/auth.json

      - name: Locate web root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          list_dir() {
            echo "=== LIST ${1:-/} ==="
            curl -sS --ftp-ssl -k --user "$FTP_USER:$FTP_PASS" --list-only "ftp://$FTP_HOST/$1" || echo "list failed"
          }
          list_dir ""
          list_dir "public_html/"
          list_dir "domains/"
          list_dir "domains/ibrahimersoran.com/"
          list_dir "domains/ibrahimersoran.com/public_html/"

          echo "sport-deploy-probe" > /tmp/deploy-probe.txt
          for dest in deploy-probe.txt public_html/deploy-probe.txt domains/ibrahimersoran.com/public_html/deploy-probe.txt; do
            echo "=== PUT $dest ==="
            curl -sS --ftp-ssl -k --user "$FTP_USER:$FTP_PASS" -T /tmp/deploy-probe.txt "ftp://$FTP_HOST/$dest" --ftp-create-dirs && echo OK || echo FAIL
          done
          echo "=== HTTP ==="
          curl -sS -D - "https://ibrahimersoran.com/deploy-probe.txt" || true
