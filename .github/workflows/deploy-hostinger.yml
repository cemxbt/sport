name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/**'

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p deploy
          cp -r public/* deploy/
          cp public/.htaccess deploy/ 2>/dev/null || true
          cp public/.nojekyll deploy/ 2>/dev/null || true
          mkdir -p deploy/data
          cp data/*.json deploy/data/ 2>/dev/null || true
          rm -f deploy/data/auth.json

      - name: Upload into the directory the domain serves
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          live=""
          for p in public_html domains/ibrahimersoran.com/public_html domains/ibrahimersoran.com; do
            echo "=== TRY $p ==="
            if curl -sS --ftp-ssl -k --fail --user "$FTP_USER:$FTP_PASS" -o /tmp/idx.html "ftp://$FTP_HOST/$p/index.html"; then
              echo "size $(wc -c < /tmp/idx.html)"
              if grep -q 'Inter:wght' /tmp/idx.html; then
                live="$p"
                echo "LIVE $p"
                break
              fi
            else
              echo "no index"
            fi
          done
          if [ -z "$live" ]; then
            echo "=== LIST public_html ==="
            curl -sS --ftp-ssl -k --user "$FTP_USER:$FTP_PASS" --list-only "ftp://$FTP_HOST/public_html/" || true
            echo "=== LIST domains ==="
            curl -sS --ftp-ssl -k --user "$FTP_USER:$FTP_PASS" --list-only "ftp://$FTP_HOST/domains/" || true
            exit 1
          fi
          cd deploy
          find . -type f | sed 's|^\./||' | while read -r file; do
            curl -sS --ftp-ssl -k --fail --user "$FTP_USER:$FTP_PASS" -T "$file" "ftp://$FTP_HOST/$live/$file" --ftp-create-dirs
            echo "ok $file"
          done
          echo "uploaded to $live"
