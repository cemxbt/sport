name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/**'
      - 'admin/**'

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p deploy
          cp -r public/* deploy/
          cp public/.htaccess deploy/ 2>/dev/null || true
          cp public/.nojekyll deploy/ 2>/dev/null || true
          mkdir -p deploy/admin deploy/data
          cp -r admin/. deploy/admin/
          cp data/*.json deploy/data/ 2>/dev/null || true
          rm -f deploy/data/auth.json

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          cd deploy
          python3 - << 'PY'
          import ftplib, io, os, time, urllib.request
          from pathlib import Path

          ftp = ftplib.FTP_TLS(timeout=60)
          ftp.connect(os.environ["FTP_HOST"], 21)
          ftp.auth()
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
          ftp.prot_p()
          ftp.set_pasv(True)
          # Login directory is public_html. The domain serves its parent.
          ftp.cwd("..")

          def ensure(directory):
              parts = []
              for part in Path(directory).parts:
                  parts.append(part)
                  path = "/".join(parts)
                  try:
                      ftp.mkd(path)
                  except ftplib.error_perm:
                      pass

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if path.parent.as_posix() != ".":
                  ensure(path.parent.as_posix())
              with path.open("rb") as handle:
                  ftp.storbinary(f"STOR {rel}", handle)
              print("Uploaded:", rel)

          remote = io.BytesIO()
          ftp.retrbinary("RETR data/config.json", remote.write)
          ftp.quit()
          local = Path("data/config.json").read_bytes()
          if remote.getvalue() != local:
              raise SystemExit("FTP config.json does not match the uploaded file")

          live = None
          for _ in range(8):
              with urllib.request.urlopen("https://ibrahimersoran.com/data/config.json", timeout=30) as res:
                  live = res.read()
              if live == local:
                  break
              time.sleep(3)
          if live != local:
              raise SystemExit("Live config.json does not match the upload")
          print("Live config.json matches")
          PY
